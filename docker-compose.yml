services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL (Source OLTP & Airflow Backend)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: uber_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c track_commit_timestamp=on
    ports:
      - "5433:5432"
    volumes:
      - ./infrastructure/postgres/init-dbs.sql:/docker-entrypoint-initdb.d/01-init-dbs.sql
      - ./src/schema/ddl.sql:/docker-entrypoint-initdb.d/02-ddl.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uber_net

  # ---------------------------------------------------------------------------
  # 1.5 Adminer (Database GUI)
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: uber_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uber_net

  # ---------------------------------------------------------------------------
  # 2. Redpanda (Kafka-compatible Message Broker)
  # ---------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.14
    container_name: uber_redpanda
    restart: always
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --mode dev-container
      - --smp 1
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uber_net

  # ---------------------------------------------------------------------------
  # 3. Redpanda Console (Web UI for Redpanda/Kafka Topics & Schemas)
  # ---------------------------------------------------------------------------
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.3.8
    container_name: uber_redpanda_console
    restart: always
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - uber_net

  # ---------------------------------------------------------------------------
  # 4. Debezium Connect (CDC Engine)
  # ---------------------------------------------------------------------------
  debezium:
    image: debezium/connect:2.4.0.Final
    container_name: uber_debezium
    restart: always
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      ENABLE_DEBEZIUM_SCRIPTING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - uber_net

  # ---------------------------------------------------------------------------
  # 5. Apache Airflow (Init, Webserver, Scheduler)
  # ---------------------------------------------------------------------------
  airflow-init:
    image: apache/airflow:2.7.3
    container_name: uber_airflow_init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow_db
      AIRFLOW__CORE__FERNET_KEY: 46ExbBqsWWBEEQQmjM9h372NqIpNiyGJWidgetKey=
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    command: version
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uber_net

  airflow-webserver:
    image: apache/airflow:2.7.3
    container_name: uber_airflow_webserver
    restart: always
    command: webserver
    ports:
      - "8085:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow_db
      AIRFLOW__CORE__FERNET_KEY: 46ExbBqsWWBEEQQmjM9h372NqIpNiyGJWidgetKey=
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - uber_net

  airflow-scheduler:
    image: apache/airflow:2.7.3
    container_name: uber_airflow_scheduler
    restart: always
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow_db
      AIRFLOW__CORE__FERNET_KEY: 46ExbBqsWWBEEQQmjM9h372NqIpNiyGJWidgetKey=
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - uber_net

  # ---------------------------------------------------------------------------
  # 6. Metabase (BI & Visualization)
  # ---------------------------------------------------------------------------
  metabase:
    image: metabase/metabase:v0.47.5
    container_name: uber_metabase
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uber_net

  # ---------------------------------------------------------------------------
  # 7. PySpark Development Environment
  # ---------------------------------------------------------------------------
  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: uber_spark
    restart: always
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MODE=master
    ports:
      - "8088:8080"
      - "4040:4040"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - uber_net

networks:
  uber_net:
    driver: bridge

volumes:
  postgres_data:
  redpanda_data:
